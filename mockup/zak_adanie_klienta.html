<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zakładanie klienta — Asystent Operatora</title>

  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              DEFAULT: '#5B5BD6',
              hover: '#4F4FC9',
              dark: '#7C7CF0',
            },
            app: {
              bg: '#FBFBF9',
              text: '#26262B',
              muted: '#8A8A94',
              line: '#ECECE8',
              'dark-bg': '#141418',
              'dark-text': '#ECECEA',
              'dark-muted': '#6E6E78',
              'dark-line': '#26262C',
              'dark-card': '#1C1C22'
            }
          }
        }
      }
    }
  </script>

  <style>
    .fade-in-up {
      animation: fadeInUp 180ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pop-icon {
      animation: popIcon 200ms cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIcon {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    .shake {
      animation: shake 300ms cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }

    /* Rows in the "Dane klienta" preview — double-click to edit in the command line */
    .editable-row { cursor: pointer; border-radius: 6px; transition: background-color .15s ease; user-select: none; }
    .editable-row:hover { background-color: rgba(91, 91, 214, 0.08); }
    .dark .editable-row:hover { background-color: rgba(139, 139, 245, 0.12); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(138, 138, 148, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(138, 138, 148, 0.5); }
  </style>
</head>

<body class="h-full bg-app-bg dark:bg-app-dark-bg text-app-text dark:text-app-dark-text font-sans transition-colors duration-200 flex flex-col antialiased">

  <!-- Progress Bar (Sticky Top) -->
  <div class="w-full bg-gray-200 dark:bg-gray-800 h-1.5">
    <div id="progressBar" class="bg-brand h-full transition-all duration-300 w-0"></div>
  </div>

  <!-- Pipeline (pasek postępu — na górze) -->
  <div class="w-full border-b border-app-line dark:border-app-dark-line bg-white/60 dark:bg-app-dark-card/40 backdrop-blur-sm">
    <div class="w-full max-w-[640px] mx-auto px-4 sm:px-6 py-3">
      <div class="flex items-start gap-3">
        <div id="pipelineBar" class="flex items-stretch gap-1.5 flex-1 min-w-0"></div>
        <button id="themeToggle" title="Przełącz motyw (⌘Q)"
          class="shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 border border-app-line dark:border-app-dark-line rounded-md text-app-muted dark:text-app-dark-muted hover:text-app-text dark:hover:text-app-dark-text hover:bg-gray-100 dark:hover:bg-gray-800 transition-all">
          <span id="themeLabel" class="text-[11px] font-medium">Tryb ciemny</span>
          <kbd class="text-[9px] font-mono opacity-60 hidden sm:inline">⌘Q</kbd>
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    /* ---------- State ---------- */
    const defaultCustomer = {
      imie: "",
      nazwisko: "",
      telefon: "",
      email: "",
      adres_klienta: "",
      wysylka_same: null,
      adres_wysylki: "",
      polecajacy: []
    };

    let customer = { imie: "", nazwisko: "", telefon: "", email: "", adres_klienta: "", wysylka_same: null, adres_wysylki: "", polecajacy: [] };
    let currentStep = 0;
    let finished = false;
    let cardCollapsed = false;
    let commandMode = false;
    let selectedPipelineGroup = null;

    /* ---------- Referrals (osoby polecające) ---------- */
    let referralMode = false;
    let referralPhase = 'select';   // 'select' (lista + ✕) lub 'qa' (pytania w command line)
    let referralCandidates = [];
    let referralQueue = [];         // kolejka pytań: {id, field:'znam'|'telefon'}
    let referralQIndex = 0;
    let referralCode = '';
    let referralIdSeq = 0;

    // Posortowane od najbardziej prawdopodobnej — pierwsza jest podstawiana domyślnie
    const REL_OPTIONS = ['Znajomy', 'Rodzina', 'Współpracownik', 'Sąsiad', 'Z polecenia', 'Inne'];

    // Fixed test data for code #1234
    const REFERRAL_TEST = [
      { imie: 'Tomasz Zieliński', telefon: '601112233' },
      { imie: 'Ewa Dąbrowska', telefon: '512223344' },
      { imie: 'Paweł Szymański', telefon: '698334455' },
      { imie: 'Agnieszka Woźniak', telefon: '788445566' }
    ];

    /* ---------- Validators ---------- */
    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test((email || '').trim());
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function capitalize(str) {
      if (!str) return '';
      return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }

    function formatPhone(d) {
      return `+48 ${d.slice(0, 3)} ${d.slice(3, 6)} ${d.slice(6, 9)}`;
    }

    /* Address format: ul. Nazwa Ulicy, Miejscowość, 00-000 */
    const ADDR_SEGMENTS = ['ul. Nazwa Ulicy', 'Miejscowość', '00-000'];

    function validateAddressFormat(v) {
      const val = (v || '').trim();
      if (!val) return { ok: false, reason: 'Adres nie może być pusty.' };
      if (!/\b\d{2}-\d{3}\b/.test(val)) {
        return { ok: false, reason: 'Brakuje kodu pocztowego w formacie 00-000.' };
      }
      const rest = val.replace(/\b\d{2}-\d{3}\b/, '').replace(/,/g, ' ').trim();
      if (rest.split(/\s+/).filter(Boolean).length < 2) {
        return { ok: false, reason: 'Podaj ulicę i miejscowość, np. ul. Długa 5, Warszawa, 00-123.' };
      }
      return { ok: true };
    }

    /* Build the gray reminder tail that shifts as the user types each part */
    function buildAddrGhostTail(val) {
      if (val.trim() === '') return ADDR_SEGMENTS.join(', ');
      const commas = (val.match(/,/g) || []).length;
      const afterLastComma = val.slice(val.lastIndexOf(',') + 1);
      const idx = Math.min(commas, ADDR_SEGMENTS.length - 1);
      const labels = [];
      if (afterLastComma.trim() === '' && commas < ADDR_SEGMENTS.length) {
        labels.push(ADDR_SEGMENTS[idx]);
      }
      for (let i = commas + 1; i < ADDR_SEGMENTS.length; i++) labels.push(ADDR_SEGMENTS[i]);
      if (labels.length === 0) return '';
      if (afterLastComma.trim() === '') {
        return (val.endsWith(' ') ? '' : ' ') + labels.join(', ');
      }
      return ', ' + labels.join(', ');
    }

    function updateGhost() {
      const ghost = document.getElementById('inputGhost');
      const input = document.getElementById('cmdInput');
      const step = (currentStep >= 0 && !finished && !commandMode) ? steps[currentStep] : null;
      if (!step || !step.ghost) {
        ghost.innerHTML = '';
        return;
      }
      const val = input.value;
      const tail = buildAddrGhostTail(val);
      ghost.innerHTML = `<span class="invisible">${escapeHtml(val)}</span>${escapeHtml(tail)}`;
    }

    /* ---------- DEV: fake data ---------- */
    const FAKE = {
      names: ['Jan Kowalski', 'Anna Nowak', 'Piotr Wiśniewski', 'Katarzyna Wójcik', 'Marek Kamiński', 'Magdalena Lewandowska'],
      phones: ['601234567', '512998877', '690112233', '788554433', '501667788'],
      emails: ['jan.kowalski@example.pl', 'anna.nowak@test.pl', 'kontakt@firma.pl', 'biuro@sklep.com.pl'],
      addrs: ['ul. Długa 5, Warszawa, 00-123', 'ul. Krótka 2, Kraków, 30-002', 'al. Lipowa 10, Gdańsk, 80-001', 'ul. Słoneczna 14/3, Poznań, 61-001']
    };

    const COMMANDS = [
      { cmd: 'podsumowanie', desc: 'Pokaż podsumowanie (Dane klienta)' },
      { cmd: 'fake ctct', desc: 'Kontakt: imię, nazwisko, telefon' },
      { cmd: 'fake mail', desc: 'Adres e-mail' },
      { cmd: 'fake adr', desc: 'Adres klienta i wysyłki' },
      { cmd: 'fake all', desc: 'Wszystkie sekcje' }
    ];
    let suggestIndex = -1;
    let choiceList = [];        // aktualnie rozwinięte opcje wybieralne
    let choiceIndex = -1;       // podświetlona pozycja w dropdownie opcji

    function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function fillFakeContact() {
      const n = randomFrom(FAKE.names).split(' ');
      customer.imie = n[0];
      customer.nazwisko = n.slice(1).join(' ');
      customer.telefon = formatPhone(randomFrom(FAKE.phones));
    }

    function fillFakeMail() {
      customer.email = randomFrom(FAKE.emails);
    }

    function fillFakeAddr() {
      customer.adres_klienta = randomFrom(FAKE.addrs);
      customer.wysylka_same = false;
      customer.adres_wysylki = randomFrom(FAKE.addrs);
    }

    /* Returns true if the raw input was a dev "fake ..." command and was handled */
    function handleDevCommand(raw) {
      const trimmed = raw.trim().toLowerCase();
      if (trimmed !== 'fake' && !trimmed.startsWith('fake ')) return false;

      const what = trimmed.split(/\s+/)[1] || 'all';
      let msg;
      switch (what) {
        case 'ctct': case 'kontakt': fillFakeContact(); msg = 'kontakt (imię, nazwisko, telefon)'; break;
        case 'mail': case 'email': fillFakeMail(); msg = 'e-mail'; break;
        case 'adr': case 'adres': fillFakeAddr(); msg = 'adres klienta i wysyłki'; break;
        case 'all': fillFakeContact(); fillFakeMail(); fillFakeAddr(); msg = 'wszystkie sekcje'; break;
        default:
          setEcho(`✗ Nieznana komenda dev: "fake ${escapeHtml(what)}". Dostępne: <strong>fake ctct</strong>, <strong>fake mail</strong>, <strong>fake adr</strong>, <strong>fake all</strong>.`, 'error');
          return true;
      }

      renderCard();
      if (currentStep >= 0 && !finished) renderStep();
      setEcho(`🧪 [DEV] Wypełniono: ${msg}.`, 'success');
      return true;
    }

    /* ---------- Steps definition ---------- */
    const steps = [
      {
        key: 'imie',
        label: 'Imię i nazwisko',
        placeholder: 'np. Jan Kowalski',
        hint: 'Podaj imię i nazwisko klienta.',
        validate(v) {
          const parts = v.trim().split(/\s+/).filter(Boolean);
          if (parts.length < 2) return { ok: false, reason: 'Podaj zarówno imię, jak i nazwisko (dwa słowa).' };
          return { ok: true };
        },
        save(v) {
          const parts = v.trim().split(/\s+/);
          customer.imie = capitalize(parts[0]);
          customer.nazwisko = parts.slice(1).map(capitalize).join(' ');
        }
      },
      {
        key: 'telefon',
        label: 'Numer telefonu',
        placeholder: 'np. 601234567',
        hint: 'Podaj numer telefonu — dokładnie 9 cyfr.',
        validate(v) {
          let digits = v.replace(/\D/g, '');
          if (digits.length === 11 && digits.startsWith('48')) digits = digits.slice(2);
          if (digits.length !== 9) return { ok: false, reason: 'Numer musi mieć dokładnie 9 cyfr.' };
          return { ok: true };
        },
        save(v) {
          let digits = v.replace(/\D/g, '');
          if (digits.length === 11 && digits.startsWith('48')) digits = digits.slice(2);
          customer.telefon = formatPhone(digits);
        }
      },
      {
        key: 'email',
        label: 'Adres e-mail',
        placeholder: 'np. jan@domena.pl',
        hint: 'Podaj adres e-mail klienta.',
        validate(v) {
          if (!validateEmail(v)) return { ok: false, reason: 'To nie jest poprawny adres e-mail.' };
          return { ok: true };
        },
        save(v) {
          customer.email = v.trim().toLowerCase();
        }
      },
      {
        key: 'adres_klienta',
        label: 'Adres klienta',
        ghost: true,
        placeholder: '',
        hint: 'Format: <strong>ul. Nazwa Ulicy, Miejscowość, 00-000</strong> — np. ul. Długa 5, Warszawa, 00-123.',
        validate: validateAddressFormat,
        save(v) {
          customer.adres_klienta = v.trim();
        }
      },
      {
        key: 'wysylka_same',
        label: 'Adres wysyłki',
        placeholder: 'tak / nie',
        hint: 'Czy adres wysyłki jest taki sam jak adres klienta? Wpisz "tak" lub "nie".',
        // Opcje wybieralne — pierwsza (najbardziej prawdopodobna) jest podstawiana domyślnie
        choices: ['Tak', 'Nie'],
        defaultChoice: 'Tak',
        validate(v) {
          const a = v.trim().toLowerCase();
          if (['tak', 't', 'nie', 'n'].includes(a)) return { ok: true };
          return { ok: false, reason: 'Wpisz "tak" lub "nie".' };
        },
        save(v) {
          const a = v.trim().toLowerCase();
          customer.wysylka_same = (a === 'tak' || a === 't');
          if (customer.wysylka_same) {
            customer.adres_wysylki = customer.adres_klienta;
          } else {
            customer.adres_wysylki = '';
          }
        }
      },
      {
        key: 'adres_wysylki',
        label: 'Adres wysyłki',
        ghost: true,
        placeholder: '',
        hint: 'Format: <strong>ul. Nazwa Ulicy, Miejscowość, 00-000</strong> — np. ul. Krótka 2, Warszawa, 00-456.',
        skip() { return customer.wysylka_same === true; },
        validate: validateAddressFormat,
        save(v) {
          customer.adres_wysylki = v.trim();
        }
      },
      {
        key: 'polecajacy',
        label: 'Osoby polecające',
        placeholder: 'Wpisz kod, np. #1234',
        hint: 'Wpisz kod polecający, aby wczytać osoby polecające. Dane testowe: <strong>#1234</strong>.',
        validate(v) {
          if (!/^#\d{3,6}$/.test(v.trim())) return { ok: false, reason: 'Kod w formacie #NNNN, np. #1234.' };
          return { ok: true };
        },
        // Handled specially in submitStep (loads list instead of advancing)
        save() {}
      }
    ];

    /* Number of real stops (counting the shipping question/address as one logical step) */
    function totalVisibleSteps() {
      // imie, telefon, email, adres_klienta, adres_wysylki, osoby polecające => 6 logical
      return 6;
    }

    /* ---------- Echo / feedback ---------- */
    function setEcho(htmlContent, type = 'info') {
      const echoContent = document.getElementById('echoContent');
      let icon = 'ℹ', iconColor = 'text-brand';
      if (type === 'success') { icon = '✓'; iconColor = 'text-emerald-500'; }
      if (type === 'error') { icon = '✗'; iconColor = 'text-rose-500'; }
      if (type === 'warning') { icon = '⚠'; iconColor = 'text-amber-500'; }
      echoContent.innerHTML = `<span class="${iconColor} font-bold text-base select-none">${icon}</span><span>${htmlContent}</span>`;
    }

    /* ---------- Input error styling ---------- */
    function markInputError() {
      const input = document.getElementById('cmdInput');
      const block = document.getElementById('inputBlock');
      input.classList.add('text-rose-600', 'dark:text-rose-400');
      input.classList.remove('text-app-text', 'dark:text-app-dark-text');
      block.classList.add('ring-2', 'ring-rose-400', 'border-transparent');
      block.classList.add('shake');
      setTimeout(() => block.classList.remove('shake'), 400);
    }

    function clearInputError() {
      const input = document.getElementById('cmdInput');
      const block = document.getElementById('inputBlock');
      input.classList.remove('text-rose-600', 'dark:text-rose-400');
      input.classList.add('text-app-text', 'dark:text-app-dark-text');
      block.classList.remove('ring-2', 'ring-rose-400', 'border-transparent');
    }

    /* ---------- Step navigation ---------- */
    function nextStepIndex(from) {
      let i = from;
      while (i < steps.length) {
        const s = steps[i];
        if (s.skip && s.skip()) { i++; continue; }
        return i;
      }
      return -1;
    }

    function prevStepIndex(from) {
      for (let i = from - 1; i >= 0; i--) {
        const s = steps[i];
        if (s.skip && s.skip()) continue;
        return i;
      }
      return -1;
    }

    /* Value to prefill when revisiting an already-filled step */
    function prefillValue(step) {
      switch (step.key) {
        case 'imie': return `${customer.imie} ${customer.nazwisko}`.trim();
        case 'telefon': return customer.telefon;
        case 'email': return customer.email;
        case 'adres_klienta': return customer.adres_klienta;
        case 'wysylka_same':
          if (customer.wysylka_same === true) return 'tak';
          if (customer.wysylka_same === false) return 'nie';
          return '';
        case 'adres_wysylki': return customer.adres_wysylki;
        case 'polecajacy': return referralCode;
        default: return '';
      }
    }

    function goBack() {
      // Referral Q&A: step back through questions, then to the select phase
      if (referralMode && referralPhase === 'qa' && !finished) {
        if (referralQIndex > 0) { referralQIndex--; renderStep(); }
        else { referralPhase = 'select'; renderStep(); }
        return;
      }

      if (finished) {
        finished = false;
        const input = document.getElementById('cmdInput');
        input.disabled = false;
        const runBtn = document.getElementById('cmdRunBtn');
        runBtn.disabled = false;
        runBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        currentStep = prevStepIndex(steps.length);
        if (referralMode) {
          referralPhase = 'qa';
          referralQIndex = Math.max(0, referralQueue.length - 1);
        }
        renderStep();
        return;
      }
      const prev = prevStepIndex(currentStep);
      if (prev === -1) return;
      currentStep = prev;
      renderStep();
    }

    function renderStep() {
      const input = document.getElementById('cmdInput');
      const label = document.getElementById('stepLabel');
      const counter = document.getElementById('stepCounter');
      const runBtn = document.getElementById('cmdRunBtn');

      setModeToggleLabel();
      document.getElementById('approveAllBtn').classList.add('hidden');

      // Command mode: the command line accepts dev commands instead of form values
      if (commandMode) {
        label.textContent = 'Tryb komend (DEV)';
        counter.textContent = 'KOMENDY';
        input.value = '';
        input.placeholder = 'np. fake all, fake adr, fake ctct, fake mail';
        input.disabled = false;
        runBtn.disabled = false;
        runBtn.textContent = 'Wykonaj';
        runBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        document.getElementById('backBtn').classList.add('hidden');
        document.getElementById('inputGhost').innerHTML = '';
        clearInputError();
        setEcho('Dostępne komendy: <strong>fake ctct</strong>, <strong>fake mail</strong>, <strong>fake adr</strong>, <strong>fake all</strong>. Naciśnij <strong>⌘F</strong> (Ctrl+F), aby wrócić do formularza.', 'info');
        input.focus();
        updateSuggestions();
        hideReferralPanel();
        return;
      }

      runBtn.textContent = 'Dalej ›';
      hideSuggestions();
      hideChoiceDropdown();
      hideReferralPanel();

      if (finished || currentStep === -1) {
        label.textContent = 'Zakończono';
        counter.textContent = 'Gotowe';
        input.value = '';
        input.placeholder = 'Dane kompletne — wpisz "Od nowa" aby zacząć ponownie';
        input.disabled = true;
        runBtn.disabled = true;
        runBtn.classList.add('opacity-50', 'cursor-not-allowed');
        setEcho('🎉 Wszystkie dane zostały wprowadzone poprawnie. Możesz cofnąć się, aby poprawić dane.', 'success');
        document.getElementById('inputGhost').innerHTML = '';
        updateBackButton();
        return;
      }

      const step = steps[currentStep];
      const logicalNumber = logicalStepNumber(currentStep);
      input.disabled = false;
      runBtn.disabled = false;
      runBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      clearInputError();
      updateGhost();

      // Referral step has three faces: enter code → pick people (✕) → Q&A in command line
      if (step.key === 'polecajacy') {
        if (!referralMode) {
          // 1) Enter code
          label.textContent = step.label;
          counter.textContent = `Krok ${logicalNumber} / ${totalVisibleSteps()}`;
          input.value = referralCode;
          input.placeholder = step.placeholder;
          runBtn.textContent = 'Wczytaj';
          hideReferralPanel();
          setEcho(step.hint, 'info');
          updateBackButton();
        } else if (referralPhase === 'select') {
          // 2) Pick people — only ✕ on rows, "Zatwierdź wszystkie" in the command line
          label.textContent = 'Osoby polecające';
          counter.textContent = `Krok ${logicalNumber} / ${totalVisibleSteps()}`;
          input.value = referralCode;
          input.placeholder = step.placeholder;
          runBtn.textContent = 'Wczytaj ponownie';
          document.getElementById('approveAllBtn').classList.remove('hidden');
          showReferralPanel();
          renderReferralPanel();
          setEcho('Wyszarz przyciskiem ✕ osoby, których nie chcesz. Następnie kliknij <strong>✓ Zatwierdź wszystkie</strong> — zapytam o każdą po kolei.', 'info');
          updateBackButton();
        } else {
          // 3) Q&A — the command line asks about each person
          const q = referralQueue[referralQIndex];
          const c = q ? findReferral(q.id) : null;
          const active = referralCandidates.filter(x => !x.excluded);
          const personNo = c ? active.findIndex(x => x.id === c.id) + 1 : 0;
          showReferralPanel();
          renderReferralPanel();
          runBtn.textContent = 'Dalej ›';
          document.getElementById('backBtn').classList.remove('hidden');

          if (c && q.field === 'znam') {
            label.textContent = `Skąd znasz — ${c.imie}`;
            counter.textContent = `Osoba ${personNo}/${active.length} · skąd znasz`;
            input.value = c.znam || REL_OPTIONS[0];
            input.placeholder = 'np. Znajomy, Rodzina, Sąsiad…';
            setEcho(`Skąd znasz osobę <strong>${escapeHtml(c.imie)}</strong>? Wpisz lub wybierz z listy poniżej.`, 'info');
            showChoiceDropdown(REL_OPTIONS, input.value);
          } else if (c) {
            label.textContent = `Telefon — ${c.imie}`;
            counter.textContent = `Osoba ${personNo}/${active.length} · telefon`;
            input.value = c.telefon || '';
            input.placeholder = 'telefon (9 cyfr)';
            setEcho(`Podaj numer telefonu osoby <strong>${escapeHtml(c.imie)}</strong> (9 cyfr).`, 'info');
          }
        }
        input.focus();
        return;
      }

      // Regular form steps
      label.textContent = step.label;
      counter.textContent = `Krok ${logicalNumber} / ${totalVisibleSteps()}`;
      input.value = prefillValue(step);
      input.placeholder = step.placeholder;
      runBtn.textContent = 'Dalej ›';
      hideReferralPanel();
      updateBackButton();

      // Opcje wybieralne: rozwiń dropdown od razu i podstaw najbardziej prawdopodobną
      setEcho(step.hint, 'info');
      if (step.choices && step.choices.length) {
        if (!input.value.trim() && step.defaultChoice) input.value = step.defaultChoice;
        showChoiceDropdown(step.choices, input.value);
      }
      input.focus();
    }

    function setModeToggleLabel() {
      const hint = document.getElementById('modeHint');
      if (hint) hint.innerHTML = commandMode
        ? '<kbd class="px-1 py-0.5 rounded bg-gray-100 dark:bg-gray-800 border border-app-line dark:border-app-dark-line">⌘F</kbd> formularz'
        : '<kbd class="px-1 py-0.5 rounded bg-gray-100 dark:bg-gray-800 border border-app-line dark:border-app-dark-line">⌘K</kbd> komendy';
    }

    function toggleCommandMode() {
      commandMode = !commandMode;
      renderStep();
    }

    /* ---------- Command suggestions ---------- */
    function updateSuggestions() {
      const box = document.getElementById('cmdSuggest');
      if (!commandMode) { hideSuggestions(); return; }

      const v = document.getElementById('cmdInput').value.trim().toLowerCase();
      const matches = COMMANDS.filter(c => v === '' || c.cmd.includes(v));
      if (matches.length === 0) { hideSuggestions(); return; }

      suggestIndex = -1;
      box.innerHTML = matches.map((m) => `
        <div data-cmd="${m.cmd}" onclick="runSuggestion('${m.cmd}')" class="suggest-item p-2.5 cursor-pointer flex justify-between items-center gap-3 text-xs font-mono transition-colors hover:bg-gray-100 dark:hover:bg-gray-800">
          <span class="font-bold text-brand dark:text-brand-dark">${m.cmd}</span>
          <span class="text-[11px] text-app-muted dark:text-app-dark-muted truncate">${escapeHtml(m.desc)}</span>
        </div>`).join('');
      box.classList.remove('hidden');
    }

    function hideSuggestions() {
      document.getElementById('cmdSuggest').classList.add('hidden');
      suggestIndex = -1;
    }

    function moveSuggest(dir) {
      const items = [...document.querySelectorAll('#cmdSuggest .suggest-item')];
      if (!items.length) return;
      suggestIndex = (suggestIndex + dir + items.length) % items.length;
      items.forEach((el, i) => {
        el.classList.toggle('bg-gray-100', i === suggestIndex);
        el.classList.toggle('dark:bg-gray-800', i === suggestIndex);
      });
    }

    function runSuggestion(cmd) {
      document.getElementById('cmdInput').value = cmd;
      hideSuggestions();
      submitStep();
    }

    function updateBackButton() {
      const backBtn = document.getElementById('backBtn');
      const canGoBack = !commandMode && (finished || prevStepIndex(currentStep) !== -1);
      backBtn.classList.toggle('hidden', !canGoBack);
    }

    /* Map internal step index to a 1..6 logical number */
    function logicalStepNumber(idx) {
      const map = { imie: 1, telefon: 2, email: 3, adres_klienta: 4, wysylka_same: 5, adres_wysylki: 5, polecajacy: 6 };
      return map[steps[idx].key] || idx + 1;
    }

    /* ---------- Osoby polecające ---------- */
    function phoneDigits(v) {
      let d = (v || '').replace(/\D/g, '');
      if (d.length === 11 && d.startsWith('48')) d = d.slice(2);
      return d;
    }
    function isValidPhone(v) { return phoneDigits(v).length === 9; }

    function loadReferralCandidates(code) {
      referralCode = code;
      let base;
      if (code === '#1234') {
        base = REFERRAL_TEST;
      } else {
        base = Array.from({ length: 3 }, () => ({ imie: randomFrom(FAKE.names), telefon: randomFrom(FAKE.phones) }));
      }
      referralCandidates = base.map(p => ({ id: ++referralIdSeq, imie: p.imie, telefon: p.telefon, znam: '', excluded: false, done: false }));
      referralMode = true;
      referralPhase = 'select';
      referralQueue = [];
      referralQIndex = 0;
      renderStep();
    }

    function showReferralPanel() { document.getElementById('referralCard').classList.remove('hidden'); }
    function hideReferralPanel() { document.getElementById('referralCard').classList.add('hidden'); }
    function findReferral(id) { return referralCandidates.find(c => c.id === id); }

    function renderReferralPanel() {
      const list = document.getElementById('referralList');
      const summary = document.getElementById('referralSummary');
      const active = referralCandidates.filter(c => !c.excluded);

      if (referralPhase === 'qa') {
        const done = referralCandidates.filter(c => c.done).length;
        summary.textContent = `(${done}/${active.length} uzupełnionych)`;
      } else {
        summary.textContent = `(${active.length}/${referralCandidates.length} wybranych)`;
      }

      if (referralCandidates.length === 0) {
        list.innerHTML = '<div class="text-app-muted dark:text-app-dark-muted italic p-2">Brak osób dla tego kodu — wpisz inny kod powyżej.</div>';
        return;
      }

      const currentId = (referralPhase === 'qa' && referralQueue[referralQIndex]) ? referralQueue[referralQIndex].id : null;

      list.innerHTML = referralCandidates.map(c => {
        // Excluded (greyed out)
        if (c.excluded) {
          return `
            <div class="rounded-lg border border-app-line/60 dark:border-app-dark-line/60 p-2 flex items-center justify-between gap-2 opacity-40">
              <span class="font-semibold truncate line-through">${escapeHtml(c.imie)}</span>
              ${referralPhase === 'select'
                ? `<button onclick="toggleExcludeReferral(${c.id})" title="Przywróć" class="px-1.5 py-1 text-[11px] rounded-md border border-app-line dark:border-app-dark-line hover:bg-gray-100 dark:hover:bg-gray-800">↩</button>`
                : '<span class="text-[11px] text-app-muted">pominięta</span>'}
            </div>`;
        }

        const details = (c.znam || c.done)
          ? `<div class="font-mono text-[11px] text-app-muted dark:text-app-dark-muted truncate">${escapeHtml(c.znam || '—')}${c.done ? ' · ' + escapeHtml(c.telefon) : ''}</div>`
          : '';
        const isCurrent = c.id === currentId;
        const border = isCurrent
          ? 'border-brand ring-1 ring-brand'
          : (c.done ? 'border-emerald-300 dark:border-emerald-800 bg-emerald-50/50 dark:bg-emerald-950/25' : 'border-app-line dark:border-app-dark-line');

        return `
          <div class="rounded-lg border ${border} p-2 flex items-center justify-between gap-2 transition-colors">
            <div class="min-w-0">
              <div class="font-semibold truncate">${escapeHtml(c.imie)}</div>
              ${details}
            </div>
            <div class="flex items-center gap-1 shrink-0">
              ${c.done ? '<span class="text-emerald-600 dark:text-emerald-400 text-[11px] font-semibold">✓</span>' : ''}
              ${isCurrent ? '<span class="text-brand dark:text-brand-dark text-[11px] font-semibold">● teraz</span>' : ''}
              ${referralPhase === 'select'
                ? `<button onclick="toggleExcludeReferral(${c.id})" title="Wyszarz" class="px-1.5 py-1 text-[11px] rounded-md text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40">✕</button>`
                : ''}
            </div>
          </div>`;
      }).join('');
    }

    function toggleExcludeReferral(id) {
      const c = findReferral(id);
      if (c) c.excluded = !c.excluded;
      renderReferralPanel();
    }

    /* Start the per-person Q&A in the command line */
    function startReferralQA() {
      const active = referralCandidates.filter(c => !c.excluded);
      if (active.length === 0) { showToast('⚠ Brak osób — przywróć kogoś albo wpisz inny kod'); return; }
      referralQueue = [];
      active.forEach(c => {
        c.znam = '';
        c.done = false;
        referralQueue.push({ id: c.id, field: 'znam' });
        referralQueue.push({ id: c.id, field: 'telefon' });
      });
      referralQIndex = 0;
      referralPhase = 'qa';
      renderStep();
    }

    /* Answer the current person's question typed in the command line */
    function answerReferralQuestion(value) {
      const q = referralQueue[referralQIndex];
      if (!q) { finishReferrals(); return; }
      const c = findReferral(q.id);
      if (!c) { referralQIndex++; renderStep(); return; }

      if (q.field === 'znam') {
        if (!value.trim()) { markInputError(); setEcho('Podaj, skąd znasz tę osobę (np. Znajomy).', 'error'); return; }
        c.znam = value.trim();
      } else { // telefon
        if (!isValidPhone(value)) { markInputError(); setEcho('Numer musi mieć 9 cyfr.', 'error'); return; }
        c.telefon = formatPhone(phoneDigits(value));
        c.done = true;
      }

      referralQIndex++;
      if (referralQIndex >= referralQueue.length) { finishReferrals(); return; }
      renderStep();
    }

    /* Clickable relationship chip in the znam question */
    function pickRel(rel) {
      document.getElementById('cmdInput').value = rel;
      submitStep();
    }

    /* ---------- Selectable options dropdown ---------- */
    /* Open the dropdown below the input with all options; the one matching the
       current value (the most probable, pre-filled) is highlighted at the top. */
    function showChoiceDropdown(choices, current) {
      const box = document.getElementById('choiceDropdown');
      choiceList = choices.slice();
      const cur = (current || '').trim().toLowerCase();
      choiceIndex = choiceList.findIndex(c => c.trim().toLowerCase() === cur);

      box.innerHTML = choiceList.map((c, i) => {
        const active = i === choiceIndex;            // aktualnie zaznaczona
        const mostProbable = i === 0;                // najbardziej prawdopodobna (zawsze pierwsza)
        const rowCls = active ? 'bg-brand/10 dark:bg-brand/20' : 'hover:bg-gray-100 dark:hover:bg-gray-800';
        const dot = active
          ? '<span class="text-brand dark:text-brand-dark font-bold">✓</span>'
          : '<span class="opacity-0">✓</span>';
        const hint = mostProbable ? '<span class="text-[10px] text-app-muted dark:text-app-dark-muted">najbardziej prawdopodobne</span>' : '';
        return `
          <div data-val="${escapeHtml(c)}" onclick="pickChoice('${escapeHtml(c)}')" class="choice-item p-2.5 cursor-pointer flex justify-between items-center gap-3 text-sm font-mono transition-colors ${rowCls}">
            <span class="flex items-center gap-2"><span class="w-3 inline-block">${dot}</span>${escapeHtml(c)}</span>
            ${hint}
          </div>`;
      }).join('');
      box.classList.remove('hidden');
    }

    function hideChoiceDropdown() {
      document.getElementById('choiceDropdown').classList.add('hidden');
      choiceList = [];
      choiceIndex = -1;
    }

    function choiceDropdownVisible() {
      return !document.getElementById('choiceDropdown').classList.contains('hidden');
    }

    /* Keyboard navigation through the options */
    function moveChoice(dir) {
      if (!choiceList.length) return;
      choiceIndex = (choiceIndex + dir + choiceList.length) % choiceList.length;
      const input = document.getElementById('cmdInput');
      input.value = choiceList[choiceIndex];
      clearInputError();
      // re-render highlight to follow the keyboard selection
      showChoiceDropdown(choiceList, input.value);
    }

    /* Re-highlight the row that matches whatever the user has typed */
    function syncChoiceHighlight() {
      if (!choiceDropdownVisible() || !choiceList.length) return;
      showChoiceDropdown(choiceList, document.getElementById('cmdInput').value);
    }

    /* Clickable option — fill the input and submit the step */
    function pickChoice(val) {
      document.getElementById('cmdInput').value = val;
      hideChoiceDropdown();
      submitStep();
    }

    function finishReferrals() {
      customer.polecajacy = referralCandidates
        .filter(c => c.done && !c.excluded)
        .map(c => ({ imie: c.imie, znam: c.znam, telefon: c.telefon }));
      finished = true;
      renderCard();
      renderStep();
      showToast(`✓ Zapisano osoby polecające: ${customer.polecajacy.length}`);
    }

    function submitStep() {
      const input = document.getElementById('cmdInput');

      // Command mode: run commands instead of filling a form field
      if (commandMode) {
        const cm = input.value.trim().toLowerCase();
        if (cm === 'podsumowanie' || cm === 'podsum' || cm === 'podsumuj') {
          openSheet();
          setEcho('📋 Podsumowanie — rozwinięto „Dane klienta" na dole.', 'success');
          return;
        }
        if (!handleDevCommand(input.value)) {
          markInputError();
          setEcho('✗ Nieznana komenda. Dostępne: <strong>podsumowanie</strong>, <strong>fake ctct</strong>, <strong>fake mail</strong>, <strong>fake adr</strong>, <strong>fake all</strong>.', 'error');
        }
        return;
      }

      if (finished) return;

      // DEV shortcut: "fake ..." also works directly in form mode
      if (handleDevCommand(input.value)) return;

      const step = steps[currentStep];
      const value = input.value;

      // Referral step has its own handling (code entry / per-person Q&A)
      if (step.key === 'polecajacy') {
        if (referralMode && referralPhase === 'qa') {
          answerReferralQuestion(value);
          return;
        }
        // code entry (first time) or re-loading a different code
        if (!/^#\d{3,6}$/.test(value.trim())) {
          markInputError();
          setEcho('Kod w formacie #NNNN, np. #1234.', 'error');
          return;
        }
        loadReferralCandidates(value.trim());
        return;
      }

      const res = step.validate(value);
      if (!res.ok) {
        markInputError();
        setEcho(res.reason, 'error');
        return;
      }

      step.save(value);
      renderCard();

      const next = nextStepIndex(currentStep + 1);
      if (next === -1) {
        currentStep = -1;
        finished = true;
        renderStep();
        showToast(`✓ Zapisano klienta: ${customer.imie} ${customer.nazwisko}`, 'success');
      } else {
        currentStep = next;
        renderStep();
      }
    }

    /* ---------- Preview card rendering ---------- */
    function renderField(key, value, ok) {
      const valEl = document.getElementById(`val-${key}`);
      const statusEl = document.getElementById(`status-${key}`);
      if (!valEl || !statusEl) return;

      if (!value) {
        valEl.textContent = 'Nie podano';
        valEl.className = 'font-mono text-xs truncate text-gray-400 italic';
        valEl.title = '';
        statusEl.innerHTML = '<span class="text-gray-300 dark:text-gray-600">—</span>';
      } else {
        valEl.textContent = value;
        valEl.className = 'font-mono text-xs font-semibold truncate text-app-text dark:text-app-dark-text';
        valEl.title = value;
        statusEl.innerHTML = ok
          ? '<span class="text-emerald-500 font-bold pop-icon inline-block">✓</span>'
          : '<span class="text-rose-500 font-bold pop-icon inline-block">✗</span>';
      }
    }

    /* Double-click a row in the "Dane klienta" preview to edit that value in the command line */
    function editFromPreview(key) {
      // Shipping address: if it mirrors the client address, jump to the "same?" question instead
      let targetKey = key;
      if (key === 'adres_wysylki' && customer.wysylka_same === true) targetKey = 'wysylka_same';

      const idx = steps.findIndex(s => s.key === targetKey);
      if (idx === -1) return;

      // Leave command mode and any finished state, land on the chosen step
      commandMode = false;
      finished = false;
      currentStep = idx;

      // Referrals: re-open the already-loaded list so edits are possible, otherwise the code prompt
      if (targetKey === 'polecajacy' && referralMode) referralPhase = 'select';

      const input = document.getElementById('cmdInput');
      input.disabled = false;
      const runBtn = document.getElementById('cmdRunBtn');
      runBtn.disabled = false;
      runBtn.classList.remove('opacity-50', 'cursor-not-allowed');

      closeSheet();
      renderStep();
      input.focus();
      input.select();
    }

    /* ---------- Pipeline (dane podstawowe → adresy → osoby polecające) ---------- */
    function groupStats() {
      let p = 0;
      if (customer.imie && customer.nazwisko) p++;
      if (customer.telefon) p++;
      if (validateEmail(customer.email)) p++;
      const podstawowe = Math.round((p / 3) * 100);

      let a = 0;
      if (customer.adres_klienta) a++;
      if (customer.adres_wysylki || customer.wysylka_same === true) a++;
      const adresy = Math.round((a / 2) * 100);

      const polecajacy = (customer.polecajacy && customer.polecajacy.length > 0) ? 100 : 0;

      return { podstawowe, adresy, polecajacy };
    }

    /* Theme-aware palette for the progress bar */
    function pipelinePalette() {
      const dark = document.documentElement.classList.contains('dark');
      return dark
        ? { track: '#26262C', text: '#ECECEA', muted: '#6E6E78' }
        : { track: '#ECECE8', text: '#26262B', muted: '#8A8A94' };
    }

    function pipelineStatusWord(pct) {
      if (pct >= 100) return 'ukończono';
      if (pct > 0) return 'w toku';
      return 'oczekuje';
    }

    /* Each section gets its own colour (light / dark variants) */
    const PIPELINE_GROUPS = [
      { key: 'podstawowe', label: 'Dane podstawowe', color: '#5B5BD6', colorDark: '#8B8BF5' },
      { key: 'adresy',     label: 'Adresy',          color: '#0D9488', colorDark: '#2DD4BF' },
      { key: 'polecajacy', label: 'Osoby polecające', color: '#D97706', colorDark: '#FBBF24' }
    ];

    function renderPipeline() {
      const bar = document.getElementById('pipelineBar');
      if (!bar) return;
      const stats = groupStats();
      const p = pipelinePalette();
      const dark = document.documentElement.classList.contains('dark');

      bar.innerHTML = PIPELINE_GROUPS.map((g, i) => {
        const pct = stats[g.key];
        const done = pct >= 100;
        const active = selectedPipelineGroup === g.key;
        const color = dark ? g.colorDark : g.color;

        const radiusL = i === 0 ? '6px' : '2px';
        const radiusR = i === PIPELINE_GROUPS.length - 1 ? '6px' : '2px';
        const ring = active ? `box-shadow:0 0 0 2px ${color};` : '';

        return `
          <button onclick="clickPipeline('${g.key}')" title="${g.label}: ${pct}%" class="flex flex-col gap-1.5 bg-transparent transition-all flex-1 min-w-0 text-left">
            <div style="position:relative;height:10px;background:${p.track};border-radius:${radiusL} ${radiusR} ${radiusR} ${radiusL};overflow:hidden;${ring}">
              <div style="position:absolute;inset:0 auto 0 0;width:${pct}%;background:${color};transition:width .35s ease;"></div>
            </div>
            <div class="flex items-baseline justify-between gap-1">
              <span class="text-[11px] font-semibold leading-tight truncate" style="color:${pct > 0 ? p.text : p.muted}">${g.label}</span>
              ${done ? `<span style="color:${color};font-size:12px;line-height:1;flex-shrink:0;">✓</span>` : ''}
            </div>
            <span class="text-[10px] font-mono -mt-0.5" style="color:${done ? color : p.muted}">${pipelineStatusWord(pct)}</span>
          </button>`;
      }).join('');
    }

    function clickPipeline(key) {
      // Klik w kwadrat otwiera szufladę „Dane klienta" i przewija do grupy; ponowny klik chowa
      if (sheetOpen && selectedPipelineGroup === key) { closeSheet(); return; }
      openSheet(key);
    }

    /* ---------- Bottom sheet „Dane klienta" ---------- */
    let sheetOpen = false;

    function openSheet(group) {
      sheetOpen = true;
      const body = document.getElementById('sheetBody');
      body.style.maxHeight = '65vh';
      document.getElementById('sheetChevron').textContent = '▾';
      document.getElementById('sheetBackdrop').classList.remove('hidden');

      if (group) {
        selectedPipelineGroup = group;
        renderPipeline();
        const el = document.getElementById('sheetGroup-' + group);
        if (el) {
          setTimeout(() => {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            el.style.backgroundColor = 'rgba(91,91,214,0.10)';
            setTimeout(() => { el.style.backgroundColor = ''; }, 1200);
          }, 320);
        }
      }
    }

    function closeSheet() {
      sheetOpen = false;
      document.getElementById('sheetBody').style.maxHeight = '0px';
      document.getElementById('sheetChevron').textContent = '▴';
      document.getElementById('sheetBackdrop').classList.add('hidden');
      if (selectedPipelineGroup) { selectedPipelineGroup = null; renderPipeline(); }
    }

    function toggleSheet() {
      if (sheetOpen) closeSheet(); else openSheet();
    }

    function renderCard() {
      const fullName = (customer.imie || customer.nazwisko) ? `${customer.imie} ${customer.nazwisko}`.trim() : '';
      renderField('imie', fullName, !!(customer.imie && customer.nazwisko));
      renderField('telefon', customer.telefon, !!customer.telefon);
      renderField('email', customer.email, validateEmail(customer.email));
      renderField('adres_klienta', customer.adres_klienta, !!customer.adres_klienta);

      let wysylkaDisplay = customer.adres_wysylki;
      if (customer.wysylka_same === true) wysylkaDisplay = `${customer.adres_klienta} (taki sam)`;
      renderField('adres_wysylki', wysylkaDisplay, !!customer.adres_wysylki || customer.wysylka_same === true);

      renderReferrersRow();
      updateProgress();
      renderPipeline();
    }

    function renderReferrersRow() {
      const valEl = document.getElementById('val-polecajacy');
      const statusEl = document.getElementById('status-polecajacy');
      if (!valEl || !statusEl) return;
      const refs = customer.polecajacy || [];
      if (refs.length === 0) {
        valEl.textContent = 'Brak';
        valEl.className = 'font-mono text-xs truncate text-gray-400 italic';
        valEl.title = '';
        statusEl.innerHTML = '<span class="text-gray-300 dark:text-gray-600">—</span>';
      } else {
        valEl.textContent = `${refs.length}: ` + refs.map(r => r.imie.split(' ')[0]).join(', ');
        valEl.className = 'font-mono text-xs font-semibold truncate text-app-text dark:text-app-dark-text';
        valEl.title = refs.map(r => `${r.imie} — ${r.znam}, ${r.telefon}`).join('\n');
        statusEl.innerHTML = '<span class="text-emerald-500 font-bold pop-icon inline-block">✓</span>';
      }
    }

    function updateProgress() {
      let filled = 0;
      if (customer.imie && customer.nazwisko) filled++;
      if (customer.telefon) filled++;
      if (validateEmail(customer.email)) filled++;
      if (customer.adres_klienta) filled++;
      if (customer.adres_wysylki) filled++;

      const pct = Math.round((filled / 5) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('completionPercent').textContent = `${pct}%`;
    }

    /* ---------- Toast ---------- */
    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'p-3 rounded-xl shadow-lg border text-xs font-mono font-semibold transition-all duration-300 fade-in-up pointer-events-auto bg-white dark:bg-app-dark-card border-brand/30 text-app-text dark:text-app-dark-text flex items-center gap-2';
      toast.innerHTML = `<span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    /* ---------- Restart ---------- */
    function restartFlow() {
      customer = { imie: "", nazwisko: "", telefon: "", email: "", adres_klienta: "", wysylka_same: null, adres_wysylki: "", polecajacy: [] };
      currentStep = 0;
      finished = false;
      commandMode = false;
      referralMode = false;
      referralPhase = 'select';
      referralCandidates = [];
      referralQueue = [];
      referralQIndex = 0;
      referralCode = '';
      selectedPipelineGroup = null;
      document.getElementById('cmdInput').disabled = false;
      renderCard();
      renderStep();
    }

    /* ---------- Events ---------- */
    document.getElementById('cmdInput').addEventListener('input', () => {
      clearInputError();
      updateGhost();
      updateSuggestions();
      syncChoiceHighlight();
    });

    document.getElementById('cmdInput').addEventListener('focus', () => {
      if (commandMode) updateSuggestions();
    });

    document.getElementById('cmdInput').addEventListener('keydown', (e) => {
      const box = document.getElementById('cmdSuggest');
      const suggestVisible = commandMode && !box.classList.contains('hidden');
      const choiceVisible = choiceDropdownVisible();

      if ((suggestVisible || choiceVisible) && e.key === 'ArrowDown') {
        e.preventDefault();
        choiceVisible ? moveChoice(1) : moveSuggest(1);
        return;
      }
      if ((suggestVisible || choiceVisible) && e.key === 'ArrowUp') {
        e.preventDefault();
        choiceVisible ? moveChoice(-1) : moveSuggest(-1);
        return;
      }
      if (e.key === 'Escape') {
        hideSuggestions();
        hideChoiceDropdown();
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (suggestVisible && suggestIndex >= 0) {
          const items = box.querySelectorAll('.suggest-item');
          runSuggestion(items[suggestIndex].dataset.cmd);
        } else {
          submitStep();
        }
      }
    });

    /* Mode switching via keyboard: ⌘K / Ctrl+K → komendy, ⌘F / Ctrl+F → formularz */
    document.addEventListener('keydown', (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (!mod) return;
      const k = e.key.toLowerCase();
      if (k === 'k' && !commandMode) {
        e.preventDefault();
        commandMode = true;
        renderStep();
      } else if (k === 'f' && commandMode) {
        e.preventDefault();
        commandMode = false;
        renderStep();
      } else if (k === 'q') {
        e.preventDefault();
        toggleTheme();
      }
    });

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      document.getElementById('themeLabel').textContent = isDark ? 'Tryb jasny' : 'Tryb ciemny';
      renderPipeline(); // odśwież kolory paska pod nowy motyw
    }

    const themeToggleBtn = document.getElementById('themeToggle');
    if (themeToggleBtn) themeToggleBtn.addEventListener('click', toggleTheme);

    /* ---------- Init ---------- */
    window.onload = function () {
      renderCard();
      renderStep();
    };
  </script>
</body>
</html>
