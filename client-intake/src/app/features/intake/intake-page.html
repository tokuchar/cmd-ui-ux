<!-- Progress Bar (Sticky Top) -->
<div
  class="w-full bg-app-track h-1.5"
  role="progressbar"
  aria-label="Postęp całkowity"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-valuenow]="engine.s.totalProgress()"
>
  <div class="bg-brand h-full transition-all duration-300" [style.width.%]="engine.s.totalProgress()"></div>
</div>

<!-- Pipeline (pasek postępu — na górze) -->
<div class="w-full border-b border-app-line bg-app-header backdrop-blur-sm">
  <div class="w-full max-w-[900px] mx-auto px-4 sm:px-6 py-3">
    <div class="flex items-start gap-3">
      <app-pipeline-bar />
      <button
        type="button"
        (click)="theme.togglePlainBg()"
        [title]="theme.plainBg() ? 'Włącz animowane tło' : 'Płaskie, jednokolorowe tło'"
        class="shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 border border-app-line rounded-md text-app-muted hover:text-app-text hover:bg-app-hover transition-all"
      >
        <span class="text-[11px] font-medium">{{ theme.plainBg() ? 'Tło: animacja' : 'Tło: płaskie' }}</span>
      </button>
      <button
        type="button"
        (click)="theme.toggle()"
        title="Przełącz motyw (⌘Q)"
        class="shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 border border-app-line rounded-md text-app-muted hover:text-app-text hover:bg-app-hover transition-all"
      >
        <span class="text-[11px] font-medium">{{ theme.isDark() ? 'Tryb jasny' : 'Tryb ciemny' }}</span>
        <kbd class="text-[9px] font-mono opacity-60 hidden sm:inline">⌘Q</kbd>
      </button>
    </div>
  </div>
</div>

<!-- Main Container -->
<main class="relative flex-1 w-full mx-auto p-4 sm:p-6 pb-24 flex flex-col items-center justify-center gap-6">
  <!-- Tło: animowana aurora (można wyłączyć → jednolity kolor bg-app-bg z body). -->
  @if (!theme.plainBg()) {
    <app-animated-background />
    <div
      aria-hidden="true"
      class="pointer-events-none absolute inset-0 z-0 bg-linear-to-b from-app-bg/45 via-app-bg/25 to-app-bg/70 dark:from-app-bg/55 dark:via-app-bg/35 dark:to-app-bg/75"
    ></div>
  }

  <section class="relative z-10 w-full max-w-[640px] flex flex-col gap-4">
    <app-command-line />
    <app-collection-card />
  </section>
</main>

<app-data-sheet />
<app-toast-outlet />
